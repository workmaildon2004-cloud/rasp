<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150" width="640" height="150" role="img" aria-label="Международный казахско-турецкий университет имени Ходжи Ахмеда Ясави" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2f9e"/><stop offset="1" stop-color="#0d8a90"/></linearGradient>
<linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="150" y1="0" x2="600" y2="0">
<stop offset="0" stop-color="#d9dcff"/><stop offset=".42" stop-color="#d9dcff"/><stop offset=".5" stop-color="#fff"/><stop offset=".58" stop-color="#d9dcff"/><stop offset="1" stop-color="#d9dcff"/>
<animateTransform attributeName="gradientTransform" type="translate" from="-450 0" to="450 0" dur="4s" repeatCount="indefinite"/></linearGradient>
<clipPath id="cg"><circle cx="60" cy="64" r="46"/></clipPath></defs>
<style>

  .mer{transform-origin:60px 64px;animation:mer 6s ease-in-out infinite}
  .m2{animation-delay:-2s}.m3{animation-delay:-4s}
  @keyframes mer{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.05)}}
  .ring{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.4s ease-out forwards}
  @keyframes dr{to{stroke-dashoffset:0}}
  .trav{animation:trav 4s ease-in-out infinite alternate}
  @keyframes trav{to{transform:translateX(76px)}}
  .l{opacity:0;transform:translateX(-16px);animation:in .8s ease-out forwards}
  .l1{animation-delay:.7s}.l2{animation-delay:.95s}.l3{animation-delay:1.2s}
  @keyframes in{to{opacity:1;transform:none}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}.l,.px{opacity:1!important;transform:none!important;filter:none!important}.draw{stroke-dashoffset:0}}
</style>
<rect width="640" height="150" rx="24" fill="url(#bg)"/>
<g transform="translate(20 11)">
<g clip-path="url(#cg)" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="3">
<ellipse class="mer m1" cx="60" cy="64" rx="44" ry="46"/><ellipse class="mer m2" cx="60" cy="64" rx="44" ry="46"/><ellipse class="mer m3" cx="60" cy="64" rx="44" ry="46"/>
<line x1="14" y1="64" x2="106" y2="64"/><path d="M18 42Q60 54 102 42"/><path d="M18 86Q60 74 102 86"/>
</g>
<circle class="draw ring" pathLength="1" cx="60" cy="64" r="46" fill="none" stroke="#fff" stroke-width="5" transform="rotate(-90 60 64)"/>
<circle class="trav" cx="22" cy="64" r="6" fill="#ff3b6b"/>
</g>
<text class="l l1" x="150" y="58" font-family="Georgia,'Times New Roman',serif" font-size="25" font-weight="700" fill="url(#shine)">Международный казахско-турецкий</text>
<text class="l l2" x="150" y="84" font-family="Georgia,'Times New Roman',serif" font-size="25" font-weight="700" fill="url(#shine)">университет имени</text>
<text class="l l3" x="150" y="110" font-family="Georgia,'Times New Roman',serif" font-size="25" font-weight="700" fill="url(#shine)">Ходжи Ахмеда Ясави</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>